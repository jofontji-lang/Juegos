<script>
/* ===== aritmética exacta: todo son enteros, en las dos modalidades ===== */
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t;}return a||1;};
const fr=(n,d)=>{const g=gcd(n,d);return{n:n/g,d:d/g};};
const mul=(x,y)=>fr(x.n*y.n,x.d*y.d);
const cmp=(x,y)=>x.n*y.d-y.n*x.d;
const val=x=>x.n/x.d;
const kf=x=>x.n+'/'+x.d;
const UNO={n:1,d:1};

const fracStr=f=>f.d===1?String(f.n):f.n+'/'+f.d;
function decStr(f){
  let d=f.d,k2=0,k5=0;
  while(d%2===0){d/=2;k2++;}
  while(d%5===0){d/=5;k5++;}
  if(d!==1) return (f.n/f.d).toFixed(6).replace('.',',');   /* no debería ocurrir en modo decimal */
  const k=Math.max(k2,k5);
  if(k===0) return String(f.n);
  const s=String(f.n*(Math.pow(10,k)/f.d)).padStart(k+1,'0');
  return s.slice(0,s.length-k)+','+s.slice(s.length-k);
}
const decimales=f=>{let d=f.d,k2=0,k5=0;while(d%2===0){d/=2;k2++;}while(d%5===0){d/=5;k5++;}
  return d===1?Math.max(k2,k5):99;};
let modo=1;                                  /* 0 = fracciones, 1 = decimales */
const show=f=>modo?decStr(f):fracStr(f);

/* ===== azar reproducible ===== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const pick=(r,a)=>a[Math.floor(r()*a.length)];
const shuffle=(r,a)=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const dist=(p,q)=>Math.hypot(p[0]-q[0],p[1]-q[1]);
const pairs=E=>[...E].map(s=>s.split('|'));
const key=(a,b)=>[a,b].sort().join('|');
const LET=['B','C','D','E','F','G','H','J','K','L','M','N'];

/* ===== dificultades: cada una con su repertorio en cada modalidad ===== */
const DIFF=[
  {name:'Fácil', size:[5,6], paths:[6,30], trap:false, minEdges:3,
   frac:{dens:[2,3,4,5],      nd:1, ints:[2,3,4,5], impropias:false, maxDen:100},
   dec :{dens:[2,5,10],       nd:1, ints:[2,3,4,5], impropias:false, maxDen:10000}},
  {name:'Normal', size:[6,8], paths:[12,90], trap:true, minEdges:3,
   frac:{dens:[2,3,4,5],      nd:2, ints:[2,3,4,5], impropias:false, maxDen:240},
   dec :{dens:[2,4,5,10],     nd:2, ints:[2,3,4,5], impropias:false, maxDen:100000}},
  {name:'Difícil', size:[8,10], paths:[24,400], trap:true, minEdges:4,
   frac:{dens:[2,3,4,5,6,8,9],nd:2, ints:[2,3,4,5,6], impropias:true, maxDen:600},
   dec :{dens:[2,4,5,10,20],  nd:2, ints:[2,3,4,5,6], impropias:true, maxDen:100000}}
];
const cfgDe=(d,m)=>m?d.dec:d.frac;

function pools(r,c){
  const ds=shuffle(r,c.dens).slice(0,c.nd);
  const small=[], large=[];
  ds.forEach(x=>{
    for(let k=1;k<x;k++) if(gcd(k,x)===1) small.push(fr(k,x));
    if(c.impropias) for(let k=x+1;k<2*x;k++) if(gcd(k,x)===1) large.push(fr(k,x));
  });
  c.ints.forEach(i=>large.push(fr(i,1)));
  return {small,large,ds};
}

/* ===== familias de tablero ===== */
function famRing(r,n){
  let inner = n>=8 ? (r()<0.7?2:1) : n>=6 ? (r()<0.5?1:(r()<0.5?2:0)) : (r()<0.55?1:0);
  let k=n-inner; if(k<4){inner=0;k=n;}
  const rot=r()*Math.PI*2, RA=128+r()*22;
  const ai=2+Math.floor(r()*Math.max(1,k-3));
  const ring=[],pos={},nodes=[]; let li=0;
  for(let i=0;i<k;i++){
    const nm = i===0?'Ω' : i===ai?'α' : LET[li++];
    ring.push(nm); nodes.push(nm);
    const ang=rot+i*2*Math.PI/k;
    pos[nm]=[200+RA*Math.cos(ang),200+RA*Math.sin(ang)];
  }
  const E=new Set(), add=(a,b)=>{if(a&&b&&a!==b)E.add(key(a,b));};
  for(let i=0;i<k;i++) add(ring[i],ring[(i+1)%k]);
  const drops = k>=6?Math.floor(r()*3) : k>=5?Math.floor(r()*2) : 0;
  for(let t=0;t<drops;t++){const j=Math.floor(r()*k);E.delete(key(ring[j],ring[(j+1)%k]));}
  const chords=(inner?0:1)+Math.floor(r()*3);
  for(let c=0;c<chords;c++){
    const i=Math.floor(r()*k), j=Math.floor(r()*k), dd=Math.abs(i-j);
    if(dd<2||dd>k-2) continue;
    add(ring[i],ring[j]);
  }
  const inn=[];
  for(let t=0;t<inner;t++){
    const nm=LET[li++]; inn.push(nm); nodes.push(nm);
    const ang=r()*Math.PI*2+t*Math.PI, rad = inner===1 ? r()*30 : 40+r()*20;
    pos[nm]=[200+rad*Math.cos(ang),200+rad*Math.sin(ang)];
    const cerca=[...ring].sort((x,y)=>dist(pos[nm],pos[x])-dist(pos[nm],pos[y]));
    const want=2+Math.floor(r()*3);
    shuffle(r,cerca.slice(0,Math.min(cerca.length,want+2))).slice(0,want).forEach(x=>add(nm,x));
  }
  if(inner===2) add(inn[0],inn[1]);
  return {pos,nodes,edges:pairs(E),fam:'anillo'};
}

function famLayer(r,n){
  const resto=n-2;
  let mid=2+Math.floor(r()*2);
  mid=Math.max(mid,Math.ceil(resto/3)); mid=Math.min(mid,resto);
  const tam=[]; let libre=resto;
  for(let i=0;i<mid;i++){
    const quedan=mid-i-1, max=Math.min(3,libre-quedan), min=Math.max(1,libre-3*quedan);
    tam.push(min+Math.floor(r()*(max-min+1))); libre-=tam[i];
  }
  const cols=[['α'],...tam.map(()=>[]),['Ω']]; let li=0;
  tam.forEach((t,ci)=>{for(let j=0;j<t;j++) cols[ci+1].push(LET[li++]);});
  const C=cols.length, pos={}, nodes=[];
  cols.forEach((col,ci)=>{
    const x=54+ci*(292/(C-1)), m=col.length;
    col.forEach((nm,j)=>{pos[nm]=[x,200+(j-(m-1)/2)*(m>2?118:132)];nodes.push(nm);});
  });
  const E=new Set(), add=(a,b)=>{if(a&&b&&a!==b)E.add(key(a,b));};
  for(let ci=0;ci<C-1;ci++){
    const A=cols[ci], Bc=cols[ci+1];
    A.forEach(a=>add(a,pick(r,Bc)));
    Bc.forEach(b=>add(pick(r,A),b));
    A.forEach(a=>Bc.forEach(b=>{if(r()<0.35) add(a,b);}));
  }
  if(cols[1].length>1)   add('α',pick(r,cols[1]));
  if(cols[C-2].length>1) add('Ω',pick(r,cols[C-2]));
  for(let ci=0;ci<C-2;ci++) if(r()<0.45) add(pick(r,cols[ci]),pick(r,cols[ci+2]));
  cols.forEach(col=>{if(col.length>1&&r()<0.4){const s=shuffle(r,col);add(s[0],s[1]);}});
  return {pos,nodes,edges:pairs(E),fam:'capas'};
}

function famGrid(r,n){
  const op=[[2,3],[2,4],[2,5],[3,3],[3,4]].filter(([R,C])=>R*C>=n&&R*C-n<=2);
  const [R,C]= op.length? op[Math.floor(r()*op.length)] : [3,4];
  const cells=[]; for(let y=0;y<R;y++) for(let x=0;x<C;x++) cells.push([x,y]);
  const esq=[[0,R-1],[C-1,0]];
  const quit=shuffle(r,cells.filter(c=>!esq.some(k=>k[0]===c[0]&&k[1]===c[1])));
  const fuera=new Set(quit.slice(0,R*C-n).map(c=>c.join(',')));
  const name={}, pos={}, nodes=[]; let li=0;
  cells.forEach(([x,y])=>{
    if(fuera.has(x+','+y)) return;
    const nm = (x===0&&y===R-1)?'α' : (x===C-1&&y===0)?'Ω' : LET[li++];
    name[x+','+y]=nm; nodes.push(nm);
    pos[nm]=[C>1?64+x*(272/(C-1)):200, R>1?72+y*(256/(R-1)):200];
  });
  const E=new Set(), add=(a,b)=>{if(a&&b&&a!==b)E.add(key(a,b));};
  cells.forEach(([x,y])=>{
    const a=name[x+','+y]; if(!a) return;
    add(a,name[(x+1)+','+y]); add(a,name[x+','+(y+1)]);
  });
  if(r()<0.55){const [x,y]=shuffle(r,cells)[0];add(name[x+','+y],name[(x+1)+','+(y+1)]);}
  const arr=[...E], q=Math.floor(r()*3);
  for(let i=0;i<q;i++) E.delete(arr[Math.floor(r()*arr.length)]);
  return {pos,nodes,edges:pairs(E),fam:'rejilla'};
}
const FAMS=[famRing,famLayer,famGrid];

function candidate(r,d,fi,m){
  const [lo,hi]=d.size, n=lo+Math.floor(r()*(hi-lo+1));
  const b=FAMS[fi](r,n);
  const P=pools(r,cfgDe(d,m));
  b.repertorio=P.ds;
  b.edges=b.edges.map(([a,c])=>[a,c, r()<0.42?pick(r,P.small):pick(r,P.large)]);
  return b;
}

/* ===== resolver y validar ===== */
function analyse(b){
  const adj={}, w={};
  b.nodes.forEach(n=>adj[n]=[]);
  for(const [a,c,x] of b.edges){adj[a].push(c);adj[c].push(a);w[key(a,c)]=x;}
  const all=[]; let over=false;
  (function walk(cur,seen,prod,path){
    if(over) return;
    if(all.length>1200){over=true;return;}
    if(cur==='Ω'){all.push({path:[...path],prod});return;}
    for(const nb of adj[cur]){ if(seen.has(nb)) continue;
      seen.add(nb); walk(nb,seen,mul(prod,w[key(cur,nb)]),[...path,nb]); seen.delete(nb);}
  })('α',new Set(['α']),UNO,['α']);
  if(over||!all.length) return null;

  const sorted=[...all].sort((x,y)=>cmp(x.prod,y.prod));
  const min=sorted[0].prod, ties=all.filter(p=>kf(p.prod)===kf(min));
  const hops=Math.min(...all.map(p=>p.path.length));
  const cortas=all.filter(p=>p.path.length===hops);
  let cur='α', seen=new Set(['α']), greedy=['α'];
  while(cur!=='Ω'){
    const opts=adj[cur].filter(x=>!seen.has(x));
    if(!opts.length) break;
    let best=opts[0];
    for(const o of opts) if(cmp(w[key(cur,o)],w[key(cur,best)])<0) best=o;
    cur=best; seen.add(cur); greedy.push(cur);
  }
  return {adj,w,all,min,ties,cortas,greedy:greedy.join('–'),minPath:sorted[0].path};
}

function valid(b,a,d,relax,m){
  if(!a) return false;
  if(b.nodes.some(n=>a.adj[n].length<2)) return false;
  const [plo,phi]=d.paths;
  if(a.all.length<(relax?4:plo) || a.all.length>phi) return false;
  if(a.ties.length>1) return false;
  if(a.minPath.length<(relax?3:d.minEdges+1)) return false;
  if(!relax && a.cortas.length===1 && a.cortas[0].path.join()===a.minPath.join()) return false;
  if(d.trap && !relax && a.minPath.join('–')===a.greedy) return false;
  if(a.min.d>cfgDe(d,m).maxDen) return false;
  if(val(a.min)<0.0008 || val(a.min)>=1) return false;      /* el mínimo siempre por debajo de 1 */
  if(Math.max(...a.all.map(p=>val(p.prod)))>20000) return false;
  if(m && a.all.some(p=>decimales(p.prod)>4)) return false;   /* decimales cortos, comprobables a mano */
  return true;
}

/* un tablero válido que no se pueda rotular con claridad se descarta */
function rotulable(t,tope){
  const L=placeLabels(t);
  return L.every(l=>l&&l.choque<=(tope||2));
}

function makeBoard(level,di,m){
  const d=DIFF[di];
  const fi=Math.floor(mulberry32((level*2654435761+di*40503+m*7717)>>>0)()*3);
  for(let round=0;round<3;round++){
    const relax=round>0;
    const orden = round<2 ? [fi] : [fi,(fi+1)%3,(fi+2)%3];
    for(const f of orden){
      const r=mulberry32((level*7919+di*104729+m*31337+round*13+f*31)>>>0);
      for(let t=0;t<250;t++){
        const b=candidate(r,d,f,m), a=analyse(b);
        if(!valid(b,a,d,relax,m)) continue;
        const t={...b,...a};
        if(rotulable(t,relax?6:2)) return t;
      }
    }
  }
  return makeBoard(level+1,di,m);
}

/* ===== sonido y vibración =====
   Todo se sintetiza al vuelo: ni un archivo de audio. El tono de cada paso sale del
   producto acumulado, comprimido logarítmicamente, así que cuanto más pequeño es el
   producto más grave suena. La ruta mínima es la más grave de todas. */
let sonido=true, vibra=true, AC=null;
function audio(){
  try{
    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
  }catch(e){AC=null;}
  return AC;
}
function tono(f,dur,tipo,vol,retardo){
  if(!sonido) return;
  const ac=audio(); if(!ac) return;
  const t0=ac.currentTime+(retardo||0);
  const o=ac.createOscillator(), g=ac.createGain();
  o.type=tipo||'triangle';
  o.frequency.setValueAtTime(f,t0);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.linearRampToValueAtTime(vol||0.16,t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+(dur||0.13));
  o.connect(g); g.connect(ac.destination);
  o.start(t0); o.stop(t0+(dur||0.13)+0.03);
}
const hz=f=>Math.max(90,Math.min(2000,660*Math.pow(Math.max(val(f),1e-6),0.35)));
function vibrar(p){ if(vibra&&navigator.vibrate){ try{navigator.vibrate(p);}catch(e){} } }

const sonPaso   =prod=>{tono(hz(prod),0.13,'triangle',0.15); vibrar(12);};
const sonMeta   =prod=>{const f=hz(prod);tono(f,0.12,'triangle',0.15);tono(f*0.75,0.2,'triangle',0.13,0.12);vibrar(28);};

  [1,1.25,1.5,2].forEach((k,i)=>tono(f*k,0.22,'sine',0.15,i*0.11));
  vibrar([0,30,60,30,60,150]);};
const sonBloqueo=()=>{tono(150,0.1,'sawtooth',0.1);tono(110,0.22,'sawtooth',0.1,0.09);vibrar([20,60,20]);};
const sonAtras  =()=>{tono(320,0.08,'sine',0.1);vibrar(8);};

/* ===== reto diario y difusión ===== */
const ORIGEN=new Date(2026,0,1);
const hoyFecha=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());};
const diaNum=f=>Math.round((f-ORIGEN)/86400000);
const fechaDeN=n=>{const d=new Date(ORIGEN);d.setDate(d.getDate()+n);return d;};
const retoDe=n=>({level:10000+n, di:1, modo:((n%2)+2)%2, n});
const retoDeHoy=()=>retoDe(diaNum(hoyFecha()));
const nDeNivel=()=>level-10000;
/* ¿esta pantalla es el reto de algún día? */
const esReto=()=>{const n=nDeNivel(); if(n<0) return false; const r=retoDe(n); return r.di===di&&r.modo===modo;};
const esDiario=()=>esReto()&&nDeNivel()===diaNum(hoyFecha());
const claveReto=n=>{const r=retoDe(n);return r.modo+':'+r.di+':'+r.level;};
const fechaCorta=n=>fechaDeN(n===undefined?diaNum(hoyFecha()):n)
  .toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'});

/* un cuadro por intento: verde el óptimo, y más frío cuanto peor fue */
function cuadro(puesto,total){
  if(puesto===1) return '🟩';
  if(puesto<=3) return '🟨';
  if(puesto<=Math.ceil(total/3)) return '🟧';
  return '🟥';
}
function textoResultado(){
  const diario=esDiario();
  const cabecera = esReto() ? `minimal route · reto del ${fechaCorta(nDeNivel())}`
                            : `minimal route · pantalla ${level} (${DIFF[di].name}, ${modo?'decimales':'fracciones'})`;
  const rejilla = intentos.map(p=>cuadro(p,B.all.length)).join('') + (revealed?'🏳️':'');
  const linea = revealed ? `${intentos.length} intento${intentos.length===1?'':'s'} · me rendí`
    : `${intentos.length} intento${intentos.length===1?'':'s'}${diario&&racha>1?` · racha ${racha}`:''}`;
  return `${cabecera}\n${rejilla}\n${linea}\n${enlace()}`;
}
function enlace(){
  const base=location.origin+location.pathname.replace(/index\.html$/,'');
  if(esDiario()) return base+'?dia';
  if(esReto())   return `${base}?reto=${nDeNivel()}`;
  return `${base}?n=${level}&d=${di}&m=${modo}`;
}

  try{ await navigator.clipboard.writeText(txt); avisar('Resultado copiado'); return; }catch(e){}

}

}
function leerURL(){

/* ===== estado ===== */
let zi=0, inspect=null; const ZOOMS=[1,1.7,2.4];
let vistaPrevia='inicio';
let level=1, di=1, B=null, path=['α'], ws=[], tries=0, found=new Map(), intentos=[], racha=0, ultimoDia=null, nivelLibre=1, vista='inicio', rendidas=new Set(),
    solved=false, revealed=false, wins=0, hechas=new Set(), verEquiv=false;

function st(){
  const cur=path[path.length-1], fin=cur==='Ω';
  const open=fin?[]:B.adj[cur].filter(n=>!path.includes(n));
  return {cur,fin,open,prod:ws.reduce((a,b)=>mul(a,b),UNO)};
}

/* ===== dibujo ===== */
/* Los rótulos se colocan buscando un hueco: se prueban varios puntos a lo largo de la
   arista y desplazamientos perpendiculares, y se elige el que menos se solape con los
   nodos y con los rótulos ya colocados. */
const overCircle=(cx,cy,w,h,c)=>{
  const px=Math.max(cx-w/2,Math.min(c.x,cx+w/2)), py=Math.max(cy-h/2,Math.min(c.y,cy+h/2));
  const d=Math.hypot(c.x-px,c.y-py);
  return d<c.r ? c.r-d : 0;
};
const overRect=(cx,cy,w,h,p)=>{
  const ox=Math.min(cx+w/2,p.cx+p.w/2)-Math.max(cx-w/2,p.cx-p.w/2);
  const oy=Math.min(cy+h/2,p.cy+p.h/2)-Math.max(cy-h/2,p.cy-p.h/2);
  return ox>0&&oy>0 ? Math.min(ox,oy) : 0;
};
const TS=[0.5,0.46,0.54,0.42,0.58,0.38,0.62,0.34,0.66,0.3,0.7,0.25,0.75,0.2,0.8];
const OFF=[0,10,-10,18,-18,26,-26,34,-34];
const TAM=[{f:15,kw:9,kh:26},{f:12.5,kw:7.5,kh:21}];   /* segundo tamaño para huecos difíciles */

function mejorHueco(T0,i,circles,placed){
  const [a,b,f]=T0.edges[i];
  const [x1,y1]=T0.pos[a],[x2,y2]=T0.pos[b];
  const dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy)||1, nx=-dy/L, ny=dx/L;
  const tx=show(f);
  let best=null;
  for(const T of TAM){
    const w=tx.length*T.kw+14, h=T.kh;
    for(const t of TS) for(const off of OFF){
      const ax=x1+dx*t, ay=y1+dy*t, cx=ax+nx*off, cy=ay+ny*off;
      if(cx-w/2<3||cx+w/2>397||cy-h/2<3||cy+h/2>397) continue;
      let choque=0;
      for(const c of circles) choque+=3*overCircle(cx,cy,w,h,c);
      for(const p of placed) if(p) choque+=overRect(cx,cy,w,h,p);
      const pen=choque+Math.abs(off)*0.03+Math.abs(t-0.5)*0.8+(T.f<15?1.2:0);
      if(!best||pen<best.pen) best={cx,cy,ax,ay,w,h,pen,choque,fs:T.f,tx,k:key(a,b)};
      if(choque===0) return best;
    }
    if(best&&best.choque<=1) break;   /* el tamaño grande ya sirve: no lo encogemos */
  }
  return best;
}

function placeLabels(T0){
  T0=T0||B;
  const circles=T0.nodes.map(n=>({x:T0.pos[n][0],y:T0.pos[n][1],r:24}));
  const largo=e=>dist(T0.pos[e[0]],T0.pos[e[1]]);
  const orden=T0.edges.map((e,i)=>i).sort((a,b)=>largo(T0.edges[a])-largo(T0.edges[b]));
  const out=[];
  for(const i of orden) out[i]=mejorHueco(T0,i,circles,out);
  /* segunda pasada: cada rótulo se recoloca viendo ya dónde están todos los demás */
  for(let v=0;v<2;v++) for(const i of orden){
    const resto=out.map((p,j)=>j===i?null:p);
    const mejor=mejorHueco(T0,i,circles,resto);
    if(mejor&&mejor.pen<out[i].pen) out[i]=mejor;
  }
  return out;
}

function draw(){
  const {cur,open}=st();
  const walked=new Set(); for(let i=0;i<path.length-1;i++) walked.add(key(path[i],path[i+1]));
  let s='';
  for(const [a,b] of B.edges){
    const k=key(a,b),[x1,y1]=B.pos[a],[x2,y2]=B.pos[b];
    const cls=walked.has(k)?'walked':((a===cur&&open.includes(b))||(b===cur&&open.includes(a))?'open':'');
    s+=`<line class="edge ${k===inspect?'sel':cls}" data-k="${k}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
  }
  /* zonas de toque anchas e invisibles: una línea de 1,6 px no se acierta con el dedo */
  for(const [a,b] of B.edges){
    const [x1,y1]=B.pos[a],[x2,y2]=B.pos[b];
    s+=`<line class="hit" data-e="${key(a,b)}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
  }
  for(const n of B.nodes){
    const [x,y]=B.pos[n];
    const cls = n===cur?'cur' : path.includes(n)?'visited' : open.includes(n)?'open':'off';
    const tap = cls==='open'?` tabindex="0" role="button" aria-label="Ir a ${n}"`:'';
    s+=`<g class="n ${cls}" data-n="${n}"${tap}><circle cx="${x}" cy="${y}" r="20"/><text x="${x}" y="${y+1}">${n}</text></g>`;
  }
  /* Los rótulos van los últimos y se clasifican por relevancia: en violeta los de las
     salidas disponibles desde donde estás, en magenta los ya recorridos y apagados los
     demás. Si el rótulo tuvo que apartarse de su arista, una línea guía lo ata a ella. */
  const vivas=new Set(open.map(n=>key(cur,n)));
  for(const L of placeLabels()){
    const cls = L.k===inspect ? 'sel' : walked.has(L.k) ? 'on' : vivas.has(L.k) ? 'live' : 'dim';
    const dx=L.ax-L.cx, dy=L.ay-L.cy;
    const kx=dx?(L.w/2)/Math.abs(dx):1e9, ky=dy?(L.h/2)/Math.abs(dy):1e9;
    const kk=Math.min(kx,ky,1), bx=L.cx+dx*kk, by=L.cy+dy*kk;
    if(Math.hypot(L.ax-bx,L.ay-by)>3||cls==='sel')
      s+=`<line class="lead ${cls}" data-k="${L.k}" x1="${bx}" y1="${by}" x2="${L.ax}" y2="${L.ay}"/>`;
    s+=`<rect class="wbg ${cls}" data-e="${L.k}" x="${L.cx-L.w/2}" y="${L.cy-L.h/2}" width="${L.w}" height="${L.h}" rx="5"/>`
     + `<text class="wt ${cls}" data-k="${L.k}" data-e="${L.k}" x="${L.cx}" y="${L.cy+1}" style="font-size:${L.fs}px">${L.tx}</text>`;
  }
  const g=document.getElementById('g');
  const z=ZOOMS[zi], vw=400/z, vh=400/z;
  const [fx,fy] = z===1 ? [200,200] : B.pos[cur];
  const vx=Math.max(0,Math.min(400-vw,fx-vw/2)), vy=Math.max(0,Math.min(400-vh,fy-vh/2));
  g.setAttribute('viewBox',`${vx} ${vy} ${vw} ${vh}`);
  g.innerHTML=s;
}

function walkedAhora(){
  const w=new Set(); for(let i=0;i<path.length-1;i++) w.add(key(path[i],path[i+1])); return w;
}

function board(){
  const {cur,fin,open,prod}=st();
  document.getElementById('expr').innerHTML=
    path.map((n,i)=>i?`<span class="num"> ×${show(ws[i-1])}× </span>${n}`:n).join('');
  const big=document.getElementById('big');
  const otro = modo? fracStr(prod) : decStr(prod);
  big.innerHTML = show(prod) + (verEquiv&&prod.d!==1?`<span class="dec">= ${otro}</span>`:'');
  if(!fin||cmp(prod,B.min)!==0) big.classList.remove('won');

  const v=document.getElementById('verdict'); v.className='verdict';
  if(revealed){
    v.classList.add('stuck');
    v.textContent=(solved?'La ruta óptima es':'Se acabó esta pantalla. El mínimo es')
      +` ${show(B.min)}, por ${B.minPath.join('–')}.`;
  } else if(fin){
    const menores=B.all.filter(p=>cmp(p.prod,prod)<0).length;
    if(cmp(prod,B.min)===0){v.classList.add('win');
      v.textContent=`Mínimo alcanzado. Ninguna de las ${B.all.length} rutas baja de ${show(B.min)}.`;}
    else v.textContent=`Puesto ${menores+1} de ${B.all.length}. Hay ${menores} ruta${menores===1?'':'s'} con producto menor.`;
  } else if(!open.length){
    v.classList.add('stuck'); v.textContent=`Sin salida en ${cur}. Deshaz un paso.`;
  } else {
    v.textContent = path.length===1?'Elige tu primer paso.':`Desde ${cur} puedes ir a ${open.join(', ')}.`;
  }
  document.getElementById('undo').disabled=revealed||path.length===1;
  const give=document.getElementById('give');
  give.disabled=revealed;
  give.textContent=solved?'Ver el óptimo':'Rendirse';
  const again=document.getElementById('again');
  again.textContent=revealed?'Siguiente pantalla':'Nueva ruta';
  const eq=document.getElementById('equiv');
  eq.hidden=false;
  eq.textContent = verEquiv ? (modo?'Ocultar la fracción':'Ocultar el decimal')
                            : (modo?'Ver la fracción':'Ver el decimal');
  document.getElementById('sub').textContent=
    `${esReto()?(esDiario()?'Reto de hoy · ':'Reto del '+fechaCorta(nDeNivel()).slice(0,5)+' · '):''}${B.nodes.length} puntos · ${B.all.length} rutas · ${modo?'decimales':'denominadores '+B.repertorio.join(' y ')}${solved?' · resuelta ✓':''}${esDiario()&&racha>1?` · racha ${racha}`:''}`;
  const sh=document.getElementById('share');
  sh.hidden=!(solved||revealed);
  const insp=document.getElementById('insp');
  if(inspect){
    let [a,b]=inspect.split('|');
    if(b===cur||a==='Ω'||(b==='α'&&a!==cur)) [a,b]=[b,a];
    const disponible = (a===cur&&open.includes(b))||(b===cur&&open.includes(a));
    const recorrida = walkedAhora().has(inspect);
    insp.textContent=`${a}–${b} vale ${show(B.w[inspect])}`
      + (recorrida?' · ya recorrida':disponible?' · salida disponible':'');
  } else insp.textContent='';
  document.getElementById('score').textContent=
    tries?`${tries} intento${tries===1?'':'s'} · ${found.size} ruta${found.size===1?'':'s'} distinta${found.size===1?'':'s'}`:'';
}

function list(){
  const el=document.getElementById('found');
  if(!found.size){el.innerHTML='<li class="empty">Todavía no has llegado a Ω.</li>';return;}
  el.innerHTML=[...found.entries()].sort((a,b)=>cmp(a[1],b[1]))
    .map(([p,f],i)=>`<li class="${i===0?'best':''}"><span class="p">${p}</span><span class="v">${show(f)}</span></li>`).join('');
}

function celebrate(){
  const svg=document.getElementById('g');
  const calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
  document.getElementById('big').classList.add('won');
  const segs=[];
  for(let i=0;i<path.length-1;i++) segs.push([key(path[i],path[i+1]),path[i+1]]);
  segs.forEach(([k,node],i)=>{
    const go=()=>{
      const ln=svg.querySelector(`.edge[data-k="${k}"]`);
      if(ln){ln.classList.remove('walked');ln.classList.add('win');}
      const tx=svg.querySelector(`.wt[data-k="${k}"]`);
      if(tx){tx.classList.remove('on','dim','live');tx.classList.add('won');}
      const ld=svg.querySelector(`.lead[data-k="${k}"]`);
      if(ld){ld.classList.remove('on','dim','live');ld.classList.add('sol');}
      const gn=svg.querySelector(`g.n[data-n="${node}"]`); if(gn) gn.classList.add('pop');
      if(i===segs.length-1){
        const [x,y]=B.pos['Ω'];
        const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
        c.setAttribute('class','halo');c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',20);
        svg.appendChild(c);
      }
    };
    calm?go():setTimeout(go,i*150);
  });
}

function revelar(){
  revealed=true;
  if(esReto()){rendidas.add(claveReto(nDeNivel()));save();}
  path=[...B.minPath];
  ws=path.slice(1).map((n,i)=>B.w[key(path[i],n)]);
  draw(); board();
  const svg=document.getElementById('g');
  const calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
  for(let i=0;i<path.length-1;i++){
    const k=key(path[i],path[i+1]);
    const go=()=>{
      const ln=svg.querySelector(`.edge[data-k="${k}"]`);
      if(ln){ln.classList.remove('walked');ln.classList.add('sol');}
      const tx=svg.querySelector(`.wt[data-k="${k}"]`);
      if(tx){tx.classList.remove('on','dim','live');tx.classList.add('sol');}
      const ld=svg.querySelector(`.lead[data-k="${k}"]`);
      if(ld){ld.classList.remove('on','dim','live');ld.classList.add('sol');}
    };
    calm?go():setTimeout(go,i*130);
  }
  sonRendir(B.min);
}

function step(n){
  if(revealed) return;
  inspect=null;
  const {cur,fin,open}=st();
  if(fin||!open.includes(n)) return;
  ws.push(B.w[key(cur,n)]); path.push(n);
  let fiesta=false;
  if(n==='Ω'){
    tries++;
    const prod=ws.reduce((a,b)=>mul(a,b),UNO);
    found.set(path.join('–'),prod);
    intentos.push(B.all.filter(p=>cmp(p.prod,prod)<0).length+1);
    if(cmp(prod,B.min)===0){fiesta=true;
      if(!solved){
        solved=true; hechas.add(modo+':'+di+':'+level); wins=hechas.size;
        if(esDiario()){
          const hoy=diaNum(hoyFecha());
          racha = (ultimoDia===hoy) ? racha : (ultimoDia===hoy-1 ? racha+1 : 1);
          ultimoDia=hoy;
        }
        save();
      }}
    list();
  }
  draw();board();
  const tras=st();
  if(n==='Ω'){ const prod=ws.reduce((a,b)=>mul(a,b),UNO);
    if(fiesta) sonVictoria(prod); else sonMeta(prod); }
  else if(!tras.open.length) sonBloqueo();
  else sonPaso(tras.prod);
  if(fiesta) celebrate();
}

/* ===== progreso ===== */
const KEY='ruta-minima-v3';
function save(){try{localStorage.setItem(KEY,JSON.stringify({level,di,modo,sonido,vibra,racha,ultimoDia,nivelLibre,done:[...hechas].slice(-800),rend:[...rendidas].slice(-800)}));}catch(e){}}
function restore(){
  try{
    const s=JSON.parse(localStorage.getItem(KEY)||'{}');
    if(Number.isInteger(s.level)&&s.level>0) level=s.level;
    if([0,1,2].includes(s.di)) di=s.di;
    if([0,1].includes(s.modo)) modo=s.modo;
    if(typeof s.sonido==='boolean') sonido=s.sonido;
    if(typeof s.vibra==='boolean') vibra=s.vibra;
    if(Number.isInteger(s.nivelLibre)&&s.nivelLibre>0) nivelLibre=s.nivelLibre;
    if(Number.isInteger(s.racha)) racha=s.racha;
    if(Number.isInteger(s.ultimoDia)) ultimoDia=s.ultimoDia;
    if(Array.isArray(s.done)) hechas=new Set(s.done);
    if(Array.isArray(s.rend)) rendidas=new Set(s.rend);
    wins=hechas.size;
  }catch(e){}
}

function load(){
  B=makeBoard(level,di,modo);
  path=['α'];ws=[];tries=0;found=new Map();intentos=[];revealed=false;verEquiv=false;inspect=null;
  solved=hechas.has(modo+':'+di+':'+level);
  document.getElementById('lvl').value=level;
  document.querySelectorAll('#diff button').forEach(b=>b.setAttribute('aria-pressed', +b.dataset.d===di));
  document.querySelectorAll('#modo button').forEach(b=>b.setAttribute('aria-pressed', +b.dataset.m===modo));
  document.querySelectorAll('#ajustes button').forEach(b=>
    b.setAttribute('aria-pressed', b.dataset.s==='son'?sonido:vibra));
  if(!esReto()) nivelLibre=level;
  document.body.classList.toggle('diario',esReto());
  guardarURL(); save(); draw(); board(); list();
}

/* ===== inicio y navegación ===== */
function pintarInicio(){
  const r=retoDeHoy();
  const hecho=hechas.has(r.modo+':'+r.di+':'+r.level);
  document.getElementById('c-dia-fecha').textContent=fechaCorta().slice(0,5);
  document.getElementById('c-dia-estado').textContent=
    hecho ? (racha>1?`resuelto ✓ · racha ${racha}`:'resuelto ✓')
          : (racha>1?`sin resolver · racha ${racha}`:'sin resolver');
  document.getElementById('c-niv-num').textContent=nivelLibre;
  document.getElementById('c-niv-estado').textContent=
    `${wins} resuelta${wins===1?'':'s'} · ${DIFF[di].name}`;
  const q=resumenRetos();
  document.getElementById('cal-resumen').textContent=`${q.hechos} de ${q.total}`;
}
function irA(v){
  vista=v;
  document.getElementById('inicio').hidden     = v!=='inicio';
  document.getElementById('juego').hidden      = v!=='juego';
  document.getElementById('calendario').hidden = v!=='calendario';
  if(v==='inicio') pintarInicio();
  if(v==='calendario'){ if(!calMes) calMes=new Date(hoyFecha().getFullYear(),hoyFecha().getMonth(),1); pintarCalendario(); }
  if(v!=='juego'){ try{ history.replaceState(null,'',location.pathname); }catch(e){} }
}

/* ===== calendario de retos ===== */
let calMes=null;
const DOW=(f)=>(f.getDay()+6)%7;            /* lunes = 0 */
function resumenRetos(){
  const hoyN=diaNum(hoyFecha());
  let hechos=0, total=hoyN+1;
  for(let n=0;n<=hoyN;n++) if(hechas.has(claveReto(n))) hechos++;
  return {hechos,total};
}
function pintarCalendario(){
  const y=calMes.getFullYear(), m=calMes.getMonth();
  document.getElementById('cal-mes').textContent=
    calMes.toLocaleDateString('es-ES',{month:'long',year:'numeric'});
  const dias=new Date(y,m+1,0).getDate(), hoyN=diaNum(hoyFecha());
  let h='';
  for(let i=0;i<DOW(new Date(y,m,1));i++) h+='<span class="cal-hueco"></span>';
  for(let d=1;d<=dias;d++){
    const n=diaNum(new Date(y,m,d));
    const fuera = n<0 || n>hoyN;
    const ok=hechas.has(claveReto(n)), rend=rendidas.has(claveReto(n));
    const cls=['cal-d', fuera?'off':'', ok?'ok':(rend?'rend':''), n===hoyN?'hoy':''].filter(Boolean).join(' ');
    h += fuera ? `<span class="${cls}">${d}</span>`
               : `<button class="${cls}" data-n="${n}" aria-label="Reto del ${d}">${d}</button>`;
  }
  document.getElementById('cal-grid').innerHTML=h;
  const prim=diaNum(new Date(y,m,1)), ult=diaNum(new Date(y,m,dias));
  document.getElementById('mes-prev').disabled = prim<=0;
  document.getElementById('mes-next').disabled = ult>=hoyN;
}
function jugarReto(n){
  const r=retoDe(n); level=r.level; di=r.di; modo=r.modo;
  sonPantalla(); irA('juego'); load();
}

/* ===== eventos ===== */
document.getElementById('card-dia').onclick=()=>{
  vistaPrevia='inicio'; jugarReto(diaNum(hoyFecha()));
};
document.getElementById('card-niveles').onclick=()=>{
  vistaPrevia='inicio'; level=nivelLibre||1;
  sonPantalla(); irA('juego'); load();
};
document.getElementById('volver').onclick=()=>{ inspect=null; irA(vistaPrevia); };
document.getElementById('card-cal').onclick=()=>{ sonPantalla(); irA('calendario'); };
document.getElementById('cal-volver').onclick=()=>irA('inicio');
document.getElementById('mes-prev').onclick=()=>{calMes=new Date(calMes.getFullYear(),calMes.getMonth()-1,1);pintarCalendario();};
document.getElementById('mes-next').onclick=()=>{calMes=new Date(calMes.getFullYear(),calMes.getMonth()+1,1);pintarCalendario();};
document.getElementById('cal-grid').onclick=e=>{
  const b=e.target.closest('button[data-n]'); if(!b)return;
  vistaPrevia='calendario'; jugarReto(+b.dataset.n);
};
const G=document.getElementById('g');
G.addEventListener('click',e=>{
  const g=e.target.closest('g.n.open');
  if(g){step(g.dataset.n); return;}
  const el=e.target.closest('[data-e]');
  if(el){
    inspect = inspect===el.dataset.e ? null : el.dataset.e;
    if(inspect) tono(hz(B.w[inspect]),0.12,'sine',0.13);
    draw(); board();
  }
});
G.addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;
  const g=e.target.closest('g.n.open');if(g){e.preventDefault();step(g.dataset.n);}});
document.getElementById('undo').onclick=()=>{if(path.length>1){path.pop();ws.pop();sonAtras();draw();board();}};
document.getElementById('again').onclick=()=>{
  if(revealed){level++;sonPantalla();load();return;}
  path=['α'];ws=[];inspect=null;sonAtras();draw();board();
};
document.getElementById('zoom').onclick=()=>{
  zi=(zi+1)%ZOOMS.length;
  document.getElementById('zoom').textContent='Zoom '+String(ZOOMS[zi]).replace('.',',')+'×';
  draw();
};
document.getElementById('equiv').onclick=()=>{verEquiv=!verEquiv;board();};
document.getElementById('give').onclick=()=>{ if(!revealed) revelar(); };
document.getElementById('share').onclick=compartir;
document.getElementById('hoy').onclick=()=>{
  const r=retoDeHoy(); level=r.level; di=r.di; modo=r.modo; sonPantalla(); load();
};
document.getElementById('prev').onclick=()=>{if(level>1){level--;sonPantalla();load();}};
document.getElementById('next').onclick=()=>{level++;sonPantalla();load();};
document.getElementById('rand').onclick=()=>{level=1+Math.floor(Math.random()*9999);load();};
document.getElementById('lvl').onchange=e=>{
  const v=parseInt(e.target.value,10);
  level=(!isNaN(v)&&v>0)?Math.min(v,99999):level; load();
};
document.getElementById('diff').onclick=e=>{
  const b=e.target.closest('button[data-d]'); if(!b)return;
  di=+b.dataset.d; load();
};
document.getElementById('ajustes').onclick=e=>{
  const b=e.target.closest('button[data-s]'); if(!b)return;
  if(b.dataset.s==='son'){sonido=!sonido; if(sonido) tono(660,0.12,'sine',0.14);}
  else {vibra=!vibra; if(vibra) vibrar(25);}
  b.setAttribute('aria-pressed',b.dataset.s==='son'?sonido:vibra);
  save();
};
document.getElementById('modo').onclick=e=>{
  const b=e.target.closest('button[data-m]'); if(!b)return;
  modo=+b.dataset.m; load();
};

restore();
if(leerURL()){ irA('juego'); load(); }
else { irA('inicio'); }

/* ===== instalación y offline ===== */
let deferred=null;
const btnInstall=document.getElementById('install');
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;btnInstall.hidden=false;});
btnInstall.onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;btnInstall.hidden=true;};
addEventListener('appinstalled',()=>{btnInstall.hidden=true;});
if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
