<!doctype html>
<!-- Genera los iconos y la imagen de compartir de Fibo. NO se sube: se abre con
     ?que=icono|maskable|og en un navegador sin cabecera y se hace captura. -->
<meta charset="utf-8">
<style>
@font-face{font-family:"Texturina";font-weight:700;src:url("../fonts/texturina-latin-700-normal.woff2") format("woff2")}
@font-face{font-family:"EB Garamond";font-weight:400;src:url("../fonts/eb-garamond-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"EB Garamond";font-weight:400;font-style:italic;src:url("../fonts/eb-garamond-latin-400-italic.woff2") format("woff2")}
@font-face{font-family:"EB Garamond";font-weight:600;src:url("../fonts/eb-garamond-latin-600-normal.woff2") format("woff2")}
:root{--vellum:#EEE2C4;--vellum-2:#E2D2AC;--iron:#2A1C10;--faded:#6B5638;--rubric:#A8321F;--lapis:#24427F;--verdigris:#3B735A;--gold:#B8872A;--gold-hi:#E6C266}
html,body{margin:0;background:transparent}
.icon{width:512px;height:512px;position:relative;background:var(--lapis);overflow:hidden}
.icon .dots{position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.28) 3px,transparent 4.5px) 0 0/34px 34px}
.icon .frame{position:absolute;border:14px solid var(--gold);outline:8px solid var(--rubric);box-shadow:inset 0 0 0 10px var(--lapis),inset 0 0 0 16px var(--gold-hi)}
.icon .f{position:absolute;inset:0;display:grid;place-items:center;font:700 330px/1 "Texturina",serif;color:var(--gold-hi);text-shadow:0 5px 0 var(--gold),0 0 4px rgba(0,0,0,.5)}
.icon.any .frame{inset:30px}.icon.any .dots{inset:44px}
.icon.mask .frame{inset:78px}.icon.mask .dots{inset:92px}
.icon.mask .f{font-size:250px}
.og{width:1200px;height:630px;box-sizing:border-box;background:radial-gradient(120% 100% at 50% 40%,var(--vellum) 55%,var(--vellum-2));padding:34px;display:flex}
.og .frame{flex:1;border:9px double var(--rubric);outline:3px solid var(--lapis);outline-offset:-22px;display:grid;grid-template-columns:1fr 520px;align-items:center;gap:40px;padding:0 64px}
.og .ini{display:flex;align-items:flex-end;gap:10px}
.og .cap{width:150px;height:150px;display:grid;place-items:center;background:radial-gradient(circle,rgba(255,255,255,.3) 2px,transparent 3px) 0 0/16px 16px,var(--lapis);border:6px solid var(--gold);outline:4px solid var(--rubric);outline-offset:4px;box-shadow:inset 0 0 0 6px var(--vellum)}
.og .cap span{font:700 120px/1 "Texturina";color:var(--gold-hi);text-shadow:0 2px 0 var(--gold)}
.og .word{font:700 128px/.9 "Texturina";color:var(--iron);padding-bottom:6px}
.og h2{margin:26px 0 10px;font:italic 400 40px/1.2 "EB Garamond";color:var(--faded)}
.og p{margin:0;font:600 30px/1.3 "EB Garamond";color:var(--rubric)}
.og svg{width:520px;height:auto}
</style>
<div id="root"></div>
<script>
const que = new URLSearchParams(location.search).get("que") || "icono";
const root = document.getElementById("root");
if (que === "og"){
  root.innerHTML = `<div class="og"><div class="frame"><div>
      <div class="ini"><div class="cap"><span>F</span></div><div class="word">ibo</div></div>
      <h2>El juego de los números de Leonardo de Pisa</h2>
      <p>1 · 1 · 2 · 3 · 5 · 8 · 13 · 21 · 34 → φ</p></div>
      <svg id="d"></svg></div></div>`;
  // mismo diagrama que la portada del juego (cuadrados 1…13 y espiral)
  const F=[1,1,2,3,5,8,13],sq=[{x:0,y:0,s:1}],prev=[null];let b=[0,0,1,1];
  for(let i=1;i<F.length;i++){const s=F[i],d=(i-1)%4;const [x,y]=d===0?[b[2],b[1]]:d===1?[b[0],b[1]-s]:d===2?[b[0]-s,b[1]]:[b[0],b[3]];prev.push(b.slice());sq.push({x,y,s});b=[Math.min(b[0],x),Math.min(b[1],y),Math.max(b[2],x+s),Math.max(b[3],y+s)];}
  const eq=(p,q)=>p[0]===q[0]&&p[1]===q[1],cor=q=>[[q.x,q.y],[q.x+q.s,q.y],[q.x+q.s,q.y+q.s],[q.x,q.y+q.s]];
  function chain(C0,P0,Q0){const a=[{C:C0,P:P0,Q:Q0,s:1}];let Q=Q0;for(let i=1;i<sq.length;i++){const pb=prev[i],cs=cor(sq[i]);const sh=cs.filter(([x,y])=>x>=pb[0]&&x<=pb[2]&&y>=pb[1]&&y<=pb[3]);if(!sh.some(p=>eq(p,Q)))return null;const C=sh.find(p=>!eq(p,Q));const Qn=cs.find(p=>!sh.some(z=>eq(z,p))&&(p[0]===C[0]||p[1]===C[1]));a.push({C,P:Q,Q:Qn,s:sq[i].s});Q=Qn;}return a;}
  let arcs=null;const c0=cor(sq[0]);for(let k=0;k<4&&!arcs;k++)arcs=chain(c0[k],c0[(k+1)%4],c0[(k+3)%4])||chain(c0[k],c0[(k+3)%4],c0[(k+1)%4]);
  const T=p=>[p[1]-b[1],p[0]-b[0]],W=b[3]-b[1],H=b[2]-b[0];
  const fills=["--lapis","--rubric","--verdigris","--vellum-2","--lapis","--rubric","--verdigris"];let g="";
  sq.forEach((q,i)=>{const [x,y]=T([q.x,q.y]),fs=Math.max(.55,q.s*.42);g+=`<rect x="${x}" y="${y}" width="${q.s}" height="${q.s}" style="fill:var(${fills[i]});stroke:var(--iron);stroke-width:.06"/><text x="${x+q.s/2}" y="${y+q.s/2+fs*.34}" text-anchor="middle" font-size="${fs}" style="font-family:'EB Garamond';font-weight:600;font-feature-settings:'onum';fill:var(${fills[i]==="--vellum-2"?"--iron":"--vellum"})">${q.s}</text>`;});
  let d="";arcs.forEach((a,i)=>{const C=T(a.C),P=T(a.P),Q=T(a.Q);const cr=(P[0]-C[0])*(Q[1]-C[1])-(P[1]-C[1])*(Q[0]-C[0]);if(!i)d+=`M${P[0]} ${P[1]}`;d+=` A${a.s} ${a.s} 0 0 ${cr>0?1:0} ${Q[0]} ${Q[1]}`;});
  g+=`<path d="${d}" style="fill:none;stroke:var(--gold-hi);stroke-width:.32;stroke-linecap:round"/>`;
  const el=document.getElementById("d");el.setAttribute("viewBox",`-.3 -.3 ${W+.6} ${H+.6}`);el.innerHTML=g;
} else {
  root.innerHTML = `<div class="icon ${que === "maskable" ? "mask" : "any"}"><div class="dots"></div><div class="frame"></div><div class="f">F</div></div>`;
}
</script>
